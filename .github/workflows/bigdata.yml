name: EA2 Big Data - Limpieza

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  cleaning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas openpyxl
          fi
          if [ -f setup.py ]; then
            pip install -e . || true
          fi

      - name: Run cleaning pipeline
        run: python src/cleaning.py

      - name: Verify outputs exist and are non-empty
        run: |
          set -e
          test -f src/xlsx/cleaned_data.xlsx
          test -s src/xlsx/cleaned_data.xlsx
          test -f src/static/auditoria/cleaning_report.txt
          test -s src/static/auditoria/cleaning_report.txt
          ls -la src/xlsx/cleaned_data.xlsx src/static/auditoria/cleaning_report.txt
          echo "Artifacts OK"

      - name: Upload cleaned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ea2-cleaned-data
          path: |
            src/xlsx/cleaned_data.xlsx
            src/static/auditoria/cleaning_report.txt
          if-no-files-found: error
